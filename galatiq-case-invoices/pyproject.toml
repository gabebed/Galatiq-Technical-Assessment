[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-processor"
version = "1.0.0"
description = "Multi-agent invoice processing: extraction, validation, reflective approval, and guarded payment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "langgraph>=1.0",
    "xai-sdk>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
invoice-processor = "invoice_processor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: calls a real external LLM API (opt in with RUN_LIVE_LLM_TESTS=1)"]
